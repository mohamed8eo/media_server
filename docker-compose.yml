services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - ${PORT:-8080}:${PORT:-8080}
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${PORT:-8080}
      BLUEPRINT_DB_URL: file:/app/db/mediaserver.db
      STORAGE_PATH: /app/storage
    volumes:
      - ${DATA_DIR:-./data}/db:/app/db
      - ${DATA_DIR:-./data}/storage:/app/storage
