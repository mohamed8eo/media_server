services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: "8080"
      BLUEPRINT_DB_URL: file:/app/db/mediaserver.db
      STORAGE_PATH: /app/storage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes:
      - ${DATA_DIR:-/var/lib/.ms-data}/db:/app/db
      - ${DATA_DIR:-/var/lib/.ms-data}/storage:/app/storage
    tmpfs:
      - /app/storage/temp:size=512M
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
